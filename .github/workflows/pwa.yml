name: PWA checks

on:
  push:
    branches: [pwa-hobby]
    paths: ['pwa/**', '.github/workflows/pwa.yml']
  pull_request:
    paths: ['pwa/**', '.github/workflows/pwa.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check pwa/app.js && node --check pwa/sw.js
      - name: Required PWA files
        run: test -s pwa/index.html && test -s pwa/styles.css && test -s pwa/manifest.webmanifest
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('pwa/manifest.webmanifest','utf8'))"
      - name: No exact private coordinates
        run: '! grep -R -E "51\\.49[0-9]{3,}|3\\.61[0-9]{3,}" pwa --exclude=app.js || true'